[platformio]
src_dir = main
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DSLATE_PDM_CLK=26
    -DSLATE_PDM_DATA=36
    -DSLATE_OLED_CLK=18
    -DSLATE_OLED_DATA=23
    -DSLATE_OLED_CS=5
    -DSLATE_OLED_DC=16
    -DSLATE_OLED_RESET=17
build_src_filter = +<controller.cpp> +<main.cpp> +<display.cpp> +<oled.cpp> +<mic.cpp> +<pdm.cpp> +<haptics.cpp>
lib_deps =
    adafruit/Adafruit SSD1351 library@1.3.3
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit DRV2605 Library@1.2.4
    adafruit/Adafruit BusIO@1.17.4
