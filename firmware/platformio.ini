[platformio]
src_dir = main
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
custom_sdkconfig =
    CONFIG_ETH_USE_OPENETH=y
    CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
    CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
    CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
    CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=4
    CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=8
    CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=8
    CONFIG_ESP_WIFI_AMPDU_RX_ENABLED=n
    CONFIG_ESP_WIFI_AMPDU_TX_ENABLED=n
monitor_speed = 921600
monitor_filters = esp32_exception_decoder
build_src_filter = +<controller.cpp> +<main.cpp> +<display.cpp> +<oled.cpp> +<mic.cpp> +<pdm.cpp> +<haptics.cpp> +<perf.cpp> +<cloud.cpp> +<device_command.cpp>
lib_deps =
    adafruit/Adafruit SSD1351 library@1.3.3
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit DRV2605 Library@1.2.4
    adafruit/Adafruit BusIO@1.17.4
    links2004/WebSockets@2.7.2
    bblanchon/ArduinoJson@7.4.2
