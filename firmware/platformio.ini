[platformio]
src_dir = main
default_envs = esp32dev

[slate-base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 921600
monitor_filters = esp32_exception_decoder
build_src_filter = +<controller.cpp> +<main.cpp> +<display.cpp> +<oled.cpp> +<mic.cpp> +<pdm.cpp> +<haptics.cpp> +<perf.cpp> +<cloud.cpp> +<ble_setup.cpp> +<device_command.cpp> +<speaker.cpp> +<power.cpp> +<bringup.cpp>
lib_deps =
    adafruit/Adafruit SSD1351 library@1.3.3
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit DRV2605 Library@1.2.4
    adafruit/Adafruit BusIO@1.17.4
    links2004/WebSockets@2.7.2
    bblanchon/ArduinoJson@7.4.2

[env:esp32dev]
extends = slate-base
extra_scripts =
    pre:nimble.py
    post:prepare_sdk.py
custom_sdkconfig =
    CONFIG_ETH_USE_OPENETH=y
    CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
    CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
    CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
    CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=4
    CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=8
    CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=8
    CONFIG_ESP_WIFI_AMPDU_RX_ENABLED=n
    CONFIG_ESP_WIFI_AMPDU_TX_ENABLED=n
    CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
    CONFIG_ARDUINO_SELECTIVE_BLE=n
    CONFIG_ARDUINO_SELECTIVE_BluetoothSerial=n
    CONFIG_ARDUINO_SELECTIVE_SimpleBLE=n
    CONFIG_ARDUINO_SELECTIVE_WiFiProv=n
    CONFIG_BT_ENABLED=y
    CONFIG_BTDM_CTRL_MODE_BLE_ONLY=y
    CONFIG_BTDM_CTRL_MODE_BTDM=n
    CONFIG_BTDM_CTRL_BLE_MAX_CONN=1
    CONFIG_BT_BLUEDROID_ENABLED=n
    CONFIG_BT_NIMBLE_ENABLED=y
    CONFIG_BT_NIMBLE_50_FEATURE_SUPPORT=n
    CONFIG_BT_NIMBLE_ROLE_CENTRAL=n
    CONFIG_BT_NIMBLE_ROLE_OBSERVER=n
    CONFIG_BT_NIMBLE_ROLE_BROADCASTER=n
    CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    CONFIG_BT_NIMBLE_MAX_BONDS=0
    CONFIG_BT_NIMBLE_NVS_PERSIST=n
    CONFIG_BT_NIMBLE_SM_LEGACY=n
    CONFIG_BT_NIMBLE_SM_SC=y
    CONFIG_BT_NIMBLE_SM_SC_ONLY=1
    CONFIG_BT_NIMBLE_SM_LVL=3
    CONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=256
    CONFIG_BT_NIMBLE_MSYS_1_BLOCK_COUNT=6
    CONFIG_BT_NIMBLE_MSYS_2_BLOCK_COUNT=6

[env:speaker-test]
extends = env:esp32dev
build_flags = -DSLATE_SPEAKER_TEST

[slate-s3-base]
extends = slate-base
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
# QIO is enabled by the second-stage bootloader. The ROM image/upload header
# must remain DIO (PlatformIO performs this conversion); never force --flash-mode qio.
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions-s3.csv
build_flags =
    -DSLATE_BOARD_S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:slate-s3]
extends = slate-s3-base
extra_scripts = ${env:esp32dev.extra_scripts}
custom_sdkconfig = ${env:esp32dev.custom_sdkconfig}

[env:slate-s3-bringup]
# No custom_sdkconfig: use precompiled ESP-IDF libraries for offline tests.
extends = slate-s3-base
# Offline bring-up uses Arduino logging directly, without the diagnostics hook.
build_unflags = -Wl,--wrap=log_printf
lib_deps =
    adafruit/Adafruit SSD1351 library@1.3.3
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
build_flags =
    -DSLATE_BOARD_S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DSLATE_BRINGUP
    -DSLATE_PCM5102
    -DPOWER_ENABLED=0
build_src_filter = +<bringup.cpp> +<display.cpp> +<oled.cpp> +<mic.cpp> +<pdm.cpp> +<speaker.cpp> +<perf.cpp>

[env:slate-s3-voice-test]
extra_scripts = ${env:esp32dev.extra_scripts}
custom_sdkconfig = ${env:esp32dev.custom_sdkconfig}
# Full voice application with the bench's UART console and PCM5102 headphones.
# Build the custom SDK for Bluetooth setup alongside the voice application.
extends = slate-s3-base
build_unflags = -Wl,--wrap=log_printf
build_flags =
    -DSLATE_BOARD_S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DSLATE_PCM5102
    -DPOWER_ENABLED=0
lib_deps =
    ${env:slate-s3-bringup.lib_deps}
    links2004/WebSockets@2.7.2
    bblanchon/ArduinoJson@7.4.2
build_src_filter = +<controller.cpp> +<main.cpp> +<display.cpp> +<oled.cpp> +<mic.cpp> +<pdm.cpp> +<perf.cpp> +<cloud.cpp> +<ble_setup.cpp> +<device_command.cpp> +<speaker.cpp> +<power.cpp>

[env:sim]
extends = env:esp32dev
build_flags = -Wl,--wrap=hal_uart_close
custom_sdkconfig =
    ${env:esp32dev.custom_sdkconfig}
    CONFIG_BT_CONTROLLER_ENABLED=n
    CONFIG_BT_CONTROLLER_DISABLED=y
    CONFIG_BT_NIMBLE_TRANSPORT_UART=y
    CONFIG_BT_NIMBLE_TRANSPORT_UART_PORT=1
    CONFIG_UART_BAUDRATE_921600=y
    CONFIG_BT_NIMBLE_UART_RX_PIN=33
    CONFIG_BT_NIMBLE_UART_TX_PIN=32
    CONFIG_UART_HW_FLOWCTRL_DISABLE=y
