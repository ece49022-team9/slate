mcu = "esp32-s3-wroom-1-n16r8"
supply_v = 3.3

[device.oled]
part = "ssd1351"
pins = { clk = 12, data = 11, cs = 10, dc = 14, reset = 21 }
# Same as board-prototype.toml; raise both only after clean frames in every state.
spi_hz = 8_000_000
frame_hz = 25
bus = "spi2"

[device.mic]
part = "mp34dt01"
pins = { clk = 4, data = 5 }
slot = "left"
sample_hz = 16_000

[device.speaker]
part = "max98357a-sd"
pins = { bclk = 6, lrclk = 17, din = 15, sd = 16 }

[device.power]
part = "slate-power"
enabled = false
pins = { hold = 1, sense = 2, fg_alrt = 18, chg_stat = 40, pgood = 41 }
i2c = { sda = 8, scl = 9 }
bus = "i2c0"

[device.future]
part = "slate-reserved"
enabled = false
pins = { haptics_en = 7, miso_sd = 13, sdcs = 47, sdcd = 42 }

[device.console]
part = "slate-console"
pins = { usb_dm = 19, usb_dp = 20, uart_tx = 43, uart_rx = 44, boot = 0 }
