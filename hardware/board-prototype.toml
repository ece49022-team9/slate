mcu = "esp32-wroom-32"
supply_v = 3.3

[device.oled]
part = "ssd1351"
pins = { clk = 18, data = 23, cs = 5, dc = 16, reset = 17 }
# 16 MHz corrupted frames on the breadboard whenever the orb was blue, magenta
# or white. A full 128x128 frame takes ~33 ms at 8 MHz, so refresh at 25 fps.
spi_hz = 8_000_000
frame_hz = 25

[device.mic]
part = "mp34dt01"
pins = { clk = 26, data = 36 }
slot = "left"
sample_hz = 16_000

[device.speaker]
part = "max98357a"
pins = { bclk = 14, lrclk = 25, din = 27 }

# Power hardware is opt-in; GPIO15 is a strapping pin.
[device.power]
part = "slate-power"
enabled = false
pins = { hold = 13, sense = 15, fg_alrt = 35, chg_stat = 34, pgood = 39 }

[device.power.i2c]
sda = 21
scl = 22
