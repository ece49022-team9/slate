[project]
name = "slate-server"
version = "0.1.0"
description = "Slate voice companion backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "httpx>=0.28,<0.29",
    "mcp==2.2.0",
    "modal==1.5.5",
    "numpy>=2.3",
    "openai>=3.14.0,<4",
    "pydantic-monty==1.0.0",
    "pyserial-asyncio-fast>=0.16",
    "soxr>=1.0",
    "uvicorn>=0.52.4,<0.53",
    "websockets>=17.1,<18",
]

[dependency-groups]
dev = [
    "esptool>=5.1,<6",
    "httpx>=0.28,<0.29",
    "hypothesis>=6.168.1",
    "ruff>=0.15,<0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/slate"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
